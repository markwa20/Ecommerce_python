<!DOCTYPE html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        {% if message %}
        {{ message }}
        {% endif %}

        <h2>Add a New Product</h2>
        
        <form action="/products" method="POST" enctype="multipart/form-data" class="w-50 mt-4">
            
            <div class="mb-3">
                <input type="text" name="name" class="form-control" placeholder="Product Name" required>
            </div>
            
            <div class="mb-3">
                <textarea name="description" class="form-control" placeholder="Description" required></textarea>
            </div>
            
            <div class="mb-3">
                <input type="number" name="price" class="form-control" placeholder="Price" step="0.01" required>
            </div>
            
            <div class="mb-3">
                <input type="number" name="stock" class="form-control" placeholder="Stock Quantity" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted">Upload Product Image:</label>
                <input type="file" name="image_file" class="form-control" accept="image/*" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Save Product</button>
        </form>
    </div>
</body>
</html>
