<!DOCTYPE html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        
        <div class="row">
            <div class="col-md-6">
                <img src="{{ product.image_url }}" class="img-fluid rounded shadow-sm" alt="{{ product.name }}">
            </div>
            
            <div class="col-md-6">
                <h1 class="display-5">{{ product.name }}</h1>
                <h2 class="text-primary">${{ product.price }}</h2>
                
                <p class="mt-4 fs-5">{{ product.description }}</p>
                <p class="text-muted">Stock available: {{ product.stock }}</p>
                
                <hr class="my-4">
                
                <form action="/add_to_cart/{{ product.id }}" method="POST" class="d-flex w-50">
                    <input type="number" name="quantity" value="1" min="1" max="{{ product.stock }}" class="form-control me-2">
                    <button type="submit" class="btn btn-warning w-100">Add to Cart</button>
                </form>
                
                <br>
                <a href="/" class="btn btn-outline-secondary mt-3">← Back to Store</a>
            </div>
        </div>
        
    </div>
</body>
</html>
